name: Deploy Tasks

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Task 2
      - name: Install Task 2
        working-directory: task2
        run: npm ci

      - name: Build Task 2
        working-directory: task2
        run: npm run build -- --base=/JS-Framework-React-HW/task2/

      # Task 3
      - name: Install Task 3
        working-directory: task3
        run: npm ci

      - name: Build Task 3
        working-directory: task3
        run: npm run build -- --base=/JS-Framework-React-HW/task3/

      # Task 4
      - name: Install Task 4
        working-directory: task4
        run: npm install

      - name: Build Task 4
        working-directory: task4
        run: npm run build -- --base=/JS-Framework-React-HW/task4/

      # Task 5
      - name: Install Task 5
        working-directory: task5
        run: npm install

      - name: Build Task 5
        working-directory: task5
        run: npm run build -- --base=/JS-Framework-React-HW/task5/

      # Midterm
      - name: Install Midterm
        working-directory: midterm
        run: npm ci

      - name: Build Midterm
        working-directory: midterm
        run: npm run build -- --base=/JS-Framework-React-HW/midterm/

      # GitHub Pages has no rewrite rules. Serving index.html as 404.html lets
      # deep links such as /task5/items/item-3 load the router instead of a 404.
      - name: Add SPA fallback for Task 5
        run: cp task5/dist/index.html task5/dist/404.html

      - name: Combine websites
        run: |
          mkdir -p _site/task2 _site/task3 _site/task4 _site/task5 _site/midterm

          cp -a task2/dist/. _site/task2/
          cp -a task3/dist/. _site/task3/
          cp -a task4/dist/. _site/task4/
          cp -a task5/dist/. _site/task5/
          cp -a midterm/dist/. _site/midterm/

          cp site/index.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
