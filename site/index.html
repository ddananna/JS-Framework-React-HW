<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React Homework</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 20px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #e6edf3;
        background: radial-gradient(circle at 20% 0%, #1b2a4f 0%, transparent 55%),
          radial-gradient(circle at 100% 100%, #2a1b4f 0%, transparent 55%), #0b0f17;
      }

      main { width: 100%; max-width: 880px; }

      h1 {
        margin: 0 0 40px;
        text-align: center;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        background: linear-gradient(90deg, #7dd3fc, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }

      .card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 110px;
        padding: 20px 22px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
        color: inherit;
        text-decoration: none;
        font-size: 1.15rem;
        font-weight: 600;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .card::after {
        content: '→';
        font-size: 1.2rem;
        color: #7dd3fc;
        opacity: 0;
        transform: translateX(-6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .card:hover,
      .card:focus-visible {
        outline: none;
        transform: translateY(-4px);
        border-color: rgba(125, 211, 252, 0.5);
        background: rgba(255, 255, 255, 0.08);
      }

      .card:hover::after,
      .card:focus-visible::after {
        opacity: 1;
        transform: translateX(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .card, .card::after { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>React Homework</h1>
      <nav class="grid">
        <a class="card" href="./task2/">Task 2</a>
        <a class="card" href="./task3/">Task 3</a>
        <a class="card" href="./task4/">Task 4</a>
        <a class="card" href="./task5/">Task 5</a>
        <a class="card" href="./task6/">Task 6</a>
        <a class="card" href="./midterm/">Midterm</a>
      </nav>
    </main>
  </body>
</html>
