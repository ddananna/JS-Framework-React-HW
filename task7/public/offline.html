<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Offline · Items Manager</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #e6edf3;
        background: radial-gradient(circle at 20% 0%, #1b2a4f 0%, transparent 55%), #0b0f17;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 32px 24px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
      }
      .icon { font-size: 3rem; margin-bottom: 8px; }
      h1 { margin: 0 0 12px; font-size: 1.6rem; }
      p { margin: 0 0 20px; color: #8b949e; line-height: 1.6; }
      button {
        min-height: 44px;
        width: 100%;
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        background: #3b5bdb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 2px; }
      .hint { margin: 14px 0 0; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        This page isn't cached yet. Pages you visited and items you loaded before are still available.
        Check your connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Retry connection</button>
      <p class="hint">This page reloads automatically when the connection returns.</p>
    </main>
    <script>
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
